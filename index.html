【專案概述】
純前端零後端圖片拼接工具。上傳多張截圖→逐張框選裁切→調整順序→
垂直拼接成長圖。手機觸控為第一優先。所有處理在瀏覽器端完成
（FileReader + Canvas），圖片不上傳。單一 HTML、無相依、無建置。

【已修正的 bug — 請勿讓其回歸】
1. selectFiles is not defined → 函式定義順序已修正
2. 手機無法拖拽紅框 → touchstart + 全域 touchmove/touchend、
   touch-action:none、{passive:false}
3. 拼接順序錯亂 → 並行 FileReader + push() 完成順序不定；
   已改為序列化處理 + 依索引寫入（processImages 內有註記）
4. 預設排序錯誤 → localeCompare numeric:true 自然排序 + flex column
5. 換順序/新增圖片後裁切設定遺失 → setupCropInterface(preserve)
   保留 cropData，initializeCrop 依比例還原先前裁切框
6. 視窗 resize 後裁切座標錯位 → resize 監聽 + 200ms debounce 重算
7. 檔名含 HTML 特殊字元破版 → escapeHtml
8. 拼接按鈕連點重複執行 → isProcessing 鎖定

【已知限制（留給後續階段）】
- 已補：CSP meta ＋ 圖片數量/單張/總像素上限（畫面內 toast 阻擋，見 head 的
  Content-Security-Policy 與 script 內 MAX_FILES / MAX_SINGLE_PIXELS / MAX_TOTAL_PIXELS）
- 無 EXIF 方向處理（iPhone 直拍可能旋轉；可用 createImageBitmap
  的 imageOrientation:'from-image' 改寫 cropAndLoadImage）
- 「下載 PNG」已依使用者需求移除，僅保留繼續合併；若日後恢復
  請用 canvas.toBlob 而非 toDataURL（記憶體較省）
- Claude.ai artifact 沙箱的 SecurityError/cookie 訊息是環境噪音

【後續路線圖（依序實施）】
階段 1：本地單檔 HTML（本檔即是，已完成）

        離線快取；GitHub Pages 已是 HTTPS 可直接支援）
階段 4：Tauri 桌面打包（使用者偏好 Tauri 而非 Electron）

【使用者偏好】
繁體中文介面與註解（台灣用語）／單檔極簡架構／
Playwright 測試（真實 Chromium）／靜態託管優先

<body>
    <div class="container">
        <h1>🖼️ 圖片拼接工具 - 手動裁切版</h1>
        <div class="upload-area" onclick="selectFiles()">
            <div class="upload-text">點擊選擇或拖放圖片至此處</div>
            <button class="upload-btn">選擇圖片</button>
            <input type="file" id="fileInput" class="file-input" multiple accept="image/*">
        </div>
        <div class="limit-toast" id="limitToast" role="status"></div>
        <div class="info-box">
            <strong>使用說明：</strong><br>
            • 選擇多張截圖後，每張圖片都會顯示裁切框<br>
            • 拖拽紅色裁切框來選擇要保留的區域<br>
            • 圖片依檔名排序，畫面上的順序就是拼接順序（第 1 個在最上方）<br>
            • 可用「拼接順序」下拉選單調整位置，也可隨時新增更多圖片<br>
            • 設定完所有圖片後點擊拼接按鈕
        </div>
        <div class="crop-area" id="cropArea">
            <div class="crop-title">設定每張圖片的裁切範圍：</div>
            <div class="add-more-section">
                <button class="add-more-btn" onclick="addMoreImages()">➕ 新增更多圖片</button>
                <input type="file" id="additionalFileInput" class="file-input" multiple accept="image/*">
            </div>
            <div class="image-crop-container" id="cropContainer"></div>
            <div class="process-section" id="processSection">
                <div class="output-controls">
                    <label>輸出設定：</label>
                    <select id="outputMode">
                        <option value="original">原始大小</option>
                        <option value="2x">2倍品質</option>
                        <option value="3x">3倍品質</option>
                        <option value="3000px" selected>固定寬度 3000px</option>
                    </select>
                </div>
                <button class="process-btn" id="processBtn" onclick="processImages()">開始拼接</button>
            </div>
        </div>
        <div class="result-area" id="resultArea">
            <h3>拼接結果：</h3>
            <canvas id="resultCanvas" class="result-canvas"></canvas>
            <div class="download-btns">
                <button class="download-btn" onclick="continueStitching()">🔄 繼續合併</button>
            </div>
        </div>
    </div>

<script>
var selectedFiles = [];
var cropData = [];
var currentDragging = null;
var isProcessing = false;

// 記憶體上限：張數、單張像素、總像素（防止多張 4K 圖撐爆手機瀏覽器記憶體）
var MAX_FILES = 10;
var MAX_SINGLE_PIXELS = 4000 * 4000;   // 單張上限：4000 x 4000 px（16,000,000 px）
var MAX_TOTAL_PIXELS = 80 * 1000000;   // 總像素上限：80,000,000 px（約 10 張 8MP 圖片的總合）
var totalPixelSum = 0;                 // 目前已納入 selectedFiles 的像素總和

// 防止檔名含 HTML 特殊字元破壞版面
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

// 畫面內提示（取代 alert，友善阻擋），5 秒後自動消失
var toastTimer = null;
function showToast(message, isError) {
    var toast = document.getElementById('limitToast');
    if (!toast) return;
    toast.textContent = message;
    toast.className = 'limit-toast' + (isError ? ' limit-toast-error' : '');
    toast.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.style.display = 'none'; }, 5000);
}

// 取得圖片像素數（張數/尺寸上限檢查用）；解碼失敗時回傳 0，交由後續流程處理
function getImagePixelCount(file) {
    return new Promise(function(resolve) {
        if (window.createImageBitmap) {
            createImageBitmap(file).then(function(bitmap) {
                var pixels = bitmap.width * bitmap.height;
                if (bitmap.close) bitmap.close();
                resolve(pixels);
            }).catch(function() { resolve(0); });
        } else {
            var url = URL.createObjectURL(file);
            var img = new Image();
            img.onload = function() { URL.revokeObjectURL(url); resolve(img.naturalWidth * img.naturalHeight); };
            img.onerror = function() { URL.revokeObjectURL(url); resolve(0); };
            img.src = url;
        }
    });
}

// 檢查張數／單張像素／總像素上限，超過則顯示 toast 並阻擋這批檔案（不進入裁切流程）
// 通過後才真正把檔案併入 selectedFiles，交由 callback 接手畫面重建
function checkAndAddFiles(files, existingCount, onPass) {
    if (existingCount + files.length > MAX_FILES) {
        showToast('📦 圖片數量過多，建議一次不超過 ' + MAX_FILES + ' 張，避免記憶體不足');
        return;
    }
    Promise.all(files.map(getImagePixelCount)).then(function(pixelCounts) {
        for (var i = 0; i < pixelCounts.length; i++) {
            if (pixelCounts[i] > MAX_SINGLE_PIXELS) {
                showToast('📦 「' + escapeHtml(files[i].name) + '」尺寸過大，單張圖片建議不超過 4000 x 4000 px');
                return;
            }
        }
        var newSum = pixelCounts.reduce(function(a, b) { return a + b; }, 0);
        if (totalPixelSum + newSum > MAX_TOTAL_PIXELS) {
            showToast('📦 圖片總像素過大，建議減少張數或使用較小的圖片，避免記憶體不足');
            return;
        }
        totalPixelSum += newSum;
        onPass();
    });
}

function selectFiles() {
    var fileInput = document.getElementById('fileInput');
    if (fileInput) fileInput.click();
}

// 自然排序，確保 1, 2, ..., 10 順序正確
function handleFiles(fileList) {
    var files = [];
    for (var i = 0; i < fileList.length; i++) {
        if (fileList[i].type.startsWith('image/')) files.push(fileList[i]);
    }
    if (files.length === 0) {
        showToast('⚠️ 未偵測到有效的圖片檔案，請選擇 JPG、PNG 等格式', true);
        return;
    }
    files.sort(function(a, b) {
        return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
    });
    checkAndAddFiles(files, 0, function() {
        selectedFiles = files;
        cropData = [];
        setupCropInterface(false);
    });
}

// preserve=true 時保留既有裁切設定（換順序、新增圖片用）
function setupCropInterface(preserve) {
    var cropArea = document.getElementById('cropArea');
    var cropContainer = document.getElementById('cropContainer');
    var processSection = document.getElementById('processSection');
    if (!cropArea || !cropContainer || !processSection) return;
    cropArea.style.display = 'block';
    processSection.style.display = 'block';
    cropContainer.innerHTML = '';
    if (!preserve) {
        cropData = new Array(selectedFiles.length);
    } else {
        cropData.length = selectedFiles.length;
    }
    for (var i = 0; i < selectedFiles.length; i++) {
        // 先依索引建立佔位節點，確保畫面卡片順序＝陣列順序，
        // 不受各張圖片 FileReader 非同步完成先後順序影響（避免拼接順序視覺上錯亂）
        var placeholder = document.createElement('div');
        placeholder.id = 'crop-item-' + i;
        cropContainer.appendChild(placeholder);
        loadImageForCrop(selectedFiles[i], i);
    }
}

function loadImageForCrop(file, index) {
    var reader = new FileReader();
    reader.onload = function(e) { createCropItem(e.target.result, file.name, index); };
    reader.readAsDataURL(file);
}

function createCropItem(imageSrc, fileName, index) {
    var placeholderNode = document.getElementById('crop-item-' + index);
    var safeName = escapeHtml(fileName);
    var positionOptions = '';
    for (var i = 0; i < selectedFiles.length; i++) {
        var selected = i === index ? ' selected' : '';
        positionOptions += '<option value="' + i + '"' + selected + '>第 ' + (i + 1) + ' 個位置</option>';
    }
    var cropItem = document.createElement('div');
    cropItem.className = 'crop-item';
    cropItem.innerHTML =
        '<div class="crop-header">' +
            '<div class="crop-name">位置 ' + (index + 1) + ': ' + safeName + '</div>' +
            '<div class="crop-controls">' +
                '<button class="crop-btn" onclick="selectAllCrop(' + index + ')">全選</button>' +
                '<button class="crop-btn" onclick="resetCropArea(' + index + ')">重設</button>' +
            '</div>' +
        '</div>' +
        '<div class="position-control">' +
            '<label>拼接順序：</label>' +
            '<select onchange="changeImagePosition(' + index + ', this.value)">' + positionOptions + '</select>' +
            '<small>第1個會在最上方</small>' +
        '</div>' +
        '<div class="image-preview" id="preview-' + index + '">' +
            '<img src="' + imageSrc + '" class="preview-img" id="img-' + index + '">' +
            '<div class="crop-overlay" id="overlay-' + index + '">' +
                '<div class="crop-selection" id="selection-' + index + '">' +
                    '<div class="crop-handle nw" data-handle="nw"></div>' +
                    '<div class="crop-handle n" data-handle="n"></div>' +
                    '<div class="crop-handle ne" data-handle="ne"></div>' +
                    '<div class="crop-handle w" data-handle="w"></div>' +
                    '<div class="crop-handle e" data-handle="e"></div>' +
                    '<div class="crop-handle sw" data-handle="sw"></div>' +
                    '<div class="crop-handle s" data-handle="s"></div>' +
                    '<div class="crop-handle se" data-handle="se"></div>' +
                '</div>' +
            '</div>' +
        '</div>' +
        '<div class="crop-info" id="info-' + index + '">選取區域：等待圖片載入...</div>';
    if (placeholderNode) {
        placeholderNode.replaceWith(cropItem);
    } else {
        var cropContainer = document.getElementById('cropContainer');
        if (cropContainer) cropContainer.appendChild(cropItem);
    }
    var img = document.getElementById('img-' + index);
    if (img) {
        img.onload = function() { initializeCrop(index); };
        if (img.complete) initializeCrop(index);
    }
}

// 若 cropData[index] 已有同一張圖的舊裁切設定，依比例還原；否則預設全選
function initializeCrop(index) {
    var img = document.getElementById('img-' + index);
    if (!img) return;
    setTimeout(function() {
        var imgRect = img.getBoundingClientRect();
        if (imgRect.width === 0) return;
        var old = cropData[index];
        var cropRect;
        if (old && old.cropRect &&
            old.originalWidth === img.naturalWidth &&
            old.originalHeight === img.naturalHeight) {
            var rx = imgRect.width / old.displayWidth;
            var ry = imgRect.height / old.displayHeight;
            cropRect = {
                x: old.cropRect.x * rx,
                y: old.cropRect.y * ry,
                width: old.cropRect.width * rx,
                height: old.cropRect.height * ry
            };
        } else {
            cropRect = { x: 0, y: 0, width: imgRect.width, height: imgRect.height };
        }
        cropData[index] = {
            originalWidth: img.naturalWidth,
            originalHeight: img.naturalHeight,
            displayWidth: imgRect.width,
            displayHeight: imgRect.height,
            cropRect: cropRect
        };
        updateSelectionDisplay(index, cropRect);
        setupCropHandlers(index);
        updateCropInfo(index);
    }, 100);
}

function updateSelectionDisplay(index, rect) {
    var selection = document.getElementById('selection-' + index);
    if (selection) {
        selection.style.left = rect.x + 'px';
        selection.style.top = rect.y + 'px';
        selection.style.width = rect.width + 'px';
        selection.style.height = rect.height + 'px';
    }
}

// 滑鼠 + 觸控雙軌事件綁定
function setupCropHandlers(index) {
    var selection = document.getElementById('selection-' + index);
    if (!selection) return;
    var handles = selection.querySelectorAll('.crop-handle');

    selection.addEventListener('mousedown', function(e) {
        if (e.target.classList.contains('crop-handle')) return;
        startDrag(index, 'move', e);
    });
    selection.addEventListener('touchstart', function(e) {
        if (e.target.classList.contains('crop-handle')) return;
        e.preventDefault();
        var t = e.touches[0];
        startDrag(index, 'move', { clientX: t.clientX, clientY: t.clientY });
    }, { passive: false });

    handles.forEach(function(handle) {
        handle.addEventListener('mousedown', function(e) {
            e.stopPropagation();
            startDrag(index, handle.dataset.handle, e);
        });
        handle.addEventListener('touchstart', function(e) {
            e.stopPropagation();
            e.preventDefault();
            var t = e.touches[0];
            startDrag(index, handle.dataset.handle, { clientX: t.clientX, clientY: t.clientY });
        }, { passive: false });
    });
}

function startDrag(index, type, e) {
    if (e.preventDefault) e.preventDefault();
    if (!cropData[index]) return;
    currentDragging = {
        index: index, type: type, startX: e.clientX, startY: e.clientY,
        startRect: Object.assign({}, cropData[index].cropRect)
    };
    document.addEventListener('mousemove', handleDrag);
    document.addEventListener('mouseup', endDrag);
}

function handleDrag(e) {
    if (!currentDragging || !cropData[currentDragging.index]) return;
    var dx = e.clientX - currentDragging.startX;
    var dy = e.clientY - currentDragging.startY;
    var index = currentDragging.index;
    var data = cropData[index];
    var newRect = Object.assign({}, currentDragging.startRect);
    var maxWidth = data.displayWidth;
    var maxHeight = data.displayHeight;
    switch (currentDragging.type) {
        case 'move':
            newRect.x = Math.max(0, Math.min(maxWidth - newRect.width, newRect.x + dx));
            newRect.y = Math.max(0, Math.min(maxHeight - newRect.height, newRect.y + dy));
            break;
        case 'se':
            newRect.width = Math.max(20, Math.min(maxWidth - newRect.x, newRect.width + dx));
            newRect.height = Math.max(20, Math.min(maxHeight - newRect.y, newRect.height + dy));
            break;
        case 'nw':
            newRect.x = Math.max(0, Math.min(newRect.x + newRect.width - 20, newRect.x + dx));
            newRect.y = Math.max(0, Math.min(newRect.y + newRect.height - 20, newRect.y + dy));
            newRect.width = Math.max(20, newRect.width - dx);
            newRect.height = Math.max(20, newRect.height - dy);
            break;
        case 'ne':
            newRect.y = Math.max(0, Math.min(newRect.y + newRect.height - 20, newRect.y + dy));
            newRect.width = Math.max(20, Math.min(maxWidth - newRect.x, newRect.width + dx));
            newRect.height = Math.max(20, newRect.height - dy);
            break;
        case 'sw':
            newRect.x = Math.max(0, Math.min(newRect.x + newRect.width - 20, newRect.x + dx));
            newRect.width = Math.max(20, newRect.width - dx);
            newRect.height = Math.max(20, Math.min(maxHeight - newRect.y, newRect.height + dy));
            break;
        case 'n':
            newRect.y = Math.max(0, Math.min(newRect.y + newRect.height - 20, newRect.y + dy));
            newRect.height = Math.max(20, newRect.height - dy);
            break;
        case 's':
            newRect.height = Math.max(20, Math.min(maxHeight - newRect.y, newRect.height + dy));
            break;
        case 'w':
            newRect.x = Math.max(0, Math.min(newRect.x + newRect.width - 20, newRect.x + dx));
            newRect.width = Math.max(20, newRect.width - dx);
            break;
        case 'e':
            newRect.width = Math.max(20, Math.min(maxWidth - newRect.x, newRect.width + dx));
            break;
    }
    data.cropRect = newRect;
    updateSelectionDisplay(index, newRect);
    updateCropInfo(index);
}

function endDrag() {
    currentDragging = null;
    document.removeEventListener('mousemove', handleDrag);
    document.removeEventListener('mouseup', endDrag);
}

function updateCropInfo(index) {
    var data = cropData[index];
    if (!data) return;
    var rect = data.cropRect;
    var scaleX = data.originalWidth / data.displayWidth;
    var scaleY = data.originalHeight / data.displayHeight;
    var info = document.getElementById('info-' + index);
    if (info) {
        info.textContent = '選取區域：' + Math.round(rect.x * scaleX) + ', ' + Math.round(rect.y * scaleY) +
            ' - ' + Math.round(rect.width * scaleX) + ' x ' + Math.round(rect.height * scaleY) + ' px';
    }
}

function addMoreImages() {
    var input = document.getElementById('additionalFileInput');
    if (input) input.click();
}

// 追加圖片時保留既有裁切設定
function addFilesToExisting(fileList) {
    var newFiles = [];
    for (var i = 0; i < fileList.length; i++) {
        if (fileList[i].type.startsWith('image/')) newFiles.push(fileList[i]);
    }
    if (newFiles.length > 0) {
        checkAndAddFiles(newFiles, selectedFiles.length, function() {
            selectedFiles = selectedFiles.concat(newFiles);
            setupCropInterface(true);
        });
    }
}

// 換位後介面重建，畫面順序永遠 = 拼接順序；裁切設定跟著檔案走
function changeImagePosition(fromIndex, toIndex) {
    toIndex = parseInt(toIndex);
    if (fromIndex === toIndex) return;
    var movedFile = selectedFiles[fromIndex];
    var movedCropData = cropData[fromIndex];
    selectedFiles.splice(fromIndex, 1);
    cropData.splice(fromIndex, 1);
    selectedFiles.splice(toIndex, 0, movedFile);
    cropData.splice(toIndex, 0, movedCropData || null);
    setupCropInterface(true);
}

function selectAllCrop(index) {
    var data = cropData[index];
    if (!data) return;
    var cropRect = { x: 0, y: 0, width: data.displayWidth, height: data.displayHeight };
    data.cropRect = cropRect;
    updateSelectionDisplay(index, cropRect);
    updateCropInfo(index);
}

function resetCropArea(index) { selectAllCrop(index); }

// 序列化處理：依索引順序逐張處理，確保拼接順序絕對正確（勿改回並行+push）
function processImages() {
    if (isProcessing) return;
    isProcessing = true;
    var btn = document.getElementById('processBtn');
    if (btn) { btn.disabled = true; btn.textContent = '拼接中...'; }

    var processedImages = [];
    function processImageAtIndex(index) {
        if (index >= selectedFiles.length) {
            stitchCroppedImages(processedImages);
            isProcessing = false;
            if (btn) { btn.disabled = false; btn.textContent = '開始拼接'; }
            return;
        }
        cropAndLoadImage(index, function(croppedCanvas) {
            processedImages[index] = croppedCanvas;
            processImageAtIndex(index + 1);
        });
    }
    processImageAtIndex(0);
}

function cropAndLoadImage(index, callback) {
    var reader = new FileReader();
    reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
            var data = cropData[index];
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            if (!data) {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                callback(canvas);
                return;
            }
            var rect = data.cropRect;
            var scaleX = data.originalWidth / data.displayWidth;
            var scaleY = data.originalHeight / data.displayHeight;
            var cropX = Math.round(rect.x * scaleX);
            var cropY = Math.round(rect.y * scaleY);
            var cropWidth = Math.max(1, Math.round(rect.width * scaleX));
            var cropHeight = Math.max(1, Math.round(rect.height * scaleY));
            canvas.width = cropWidth;
            canvas.height = cropHeight;
            ctx.drawImage(img, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
            callback(canvas);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(selectedFiles[index]);
}

// 由上到下依序拼接：索引 0 在最上方
function stitchCroppedImages(canvases) {
    var outputMode = document.getElementById('outputMode').value;
    var maxWidth = 0, totalHeight = 0, scaleFactor = 1;
    for (var i = 0; i < canvases.length; i++) {
        if (canvases[i]) {
            maxWidth = Math.max(maxWidth, canvases[i].width);
            totalHeight += canvases[i].height;
        }
    }
    if (maxWidth === 0) return;
    switch (outputMode) {
        case '2x': scaleFactor = 2; break;
        case '3x': scaleFactor = 3; break;
        case '3000px': scaleFactor = 3000 / maxWidth; break;
        default: scaleFactor = 1; break;
    }
    var finalWidth = Math.round(maxWidth * scaleFactor);
    var finalHeight = Math.round(totalHeight * scaleFactor);
    var resultCanvas = document.getElementById('resultCanvas');
    var ctx = resultCanvas.getContext('2d');
    resultCanvas.width = finalWidth;
    resultCanvas.height = finalHeight;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, finalWidth, finalHeight);
    var currentY = 0;
    for (var j = 0; j < canvases.length; j++) {
        var canvas = canvases[j];
        if (canvas) {
            var scaledHeight = Math.round(canvas.height * scaleFactor);
            var scaledWidth = Math.round(canvas.width * scaleFactor);
            var x = Math.round((finalWidth - scaledWidth) / 2);
            ctx.drawImage(canvas, x, currentY, scaledWidth, scaledHeight);
            currentY += scaledHeight;
        }
    }
    document.getElementById('resultArea').style.display = 'block';
    document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
}

function continueStitching() {
    selectedFiles = [];
    cropData = [];
    totalPixelSum = 0;
    document.getElementById('resultArea').style.display = 'none';
    document.getElementById('cropArea').style.display = 'none';
    document.getElementById('cropContainer').innerHTML = '';
    document.querySelector('.upload-area').scrollIntoView({ behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', function() {
    var fileInput = document.getElementById('fileInput');
    if (fileInput) {
        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) handleFiles(e.target.files);
            e.target.value = ''; // 允許重複選同一批檔案
        });
    }
    var additionalFileInput = document.getElementById('additionalFileInput');
    if (additionalFileInput) {
        additionalFileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) addFilesToExisting(e.target.files);
            e.target.value = '';
        });
    }
    // 桌面拖放檔案：拖入上傳區域即可選取圖片（與點擊選取走同一流程）
    var uploadArea = document.querySelector('.upload-area');
    if (uploadArea) {
        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.add('drag-over');
        });
        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('drag-over');
        });
        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('drag-over');
            if (e.dataTransfer && e.dataTransfer.files.length > 0) {
                if (selectedFiles.length > 0) {
                    addFilesToExisting(e.dataTransfer.files);
                } else {
                    handleFiles(e.dataTransfer.files);
                }
            }
        });
    }
    // 手機：拖拽中禁止頁面滾動，並將觸控轉發給拖拽處理器
    document.addEventListener('touchmove', function(e) {
        if (currentDragging) {
            e.preventDefault();
            var t = e.touches[0];
            handleDrag({ clientX: t.clientX, clientY: t.clientY });
        }
    }, { passive: false });
    document.addEventListener('touchend', function() {
        if (currentDragging) endDrag();
    });
    // 視窗尺寸改變（含手機轉向）：依比例重算所有裁切框，避免座標錯位
    var resizeTimer;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            for (var i = 0; i < selectedFiles.length; i++) {
                var img = document.getElementById('img-' + i);
                var d = cropData[i];
                if (!img || !d) continue;
                var r = img.getBoundingClientRect();
                if (r.width === 0) continue;
                var rx = r.width / d.displayWidth;
                var ry = r.height / d.displayHeight;
                d.cropRect = {
                    x: d.cropRect.x * rx, y: d.cropRect.y * ry,
                    width: d.cropRect.width * rx, height: d.cropRect.height * ry
                };
                d.displayWidth = r.width;
                d.displayHeight = r.height;
                updateSelectionDisplay(i, d.cropRect);
                updateCropInfo(i);
            }
        }, 200);
    });
});
</script>

<script>
// PWA（階段 3）：註冊 service worker，讓工具離線也能開啟。
// 只在瀏覽器支援且是 http(s) 協定時才註冊（file:// 開啟本檔案時 SW 無法運作，靜默跳過即可）。
if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
            console.log('[SW] 註冊成功，scope：', reg.scope);
        }).catch(function (err) {
            console.warn('[SW] 註冊失敗：', err);
        });
    });
}
</script>
